name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - name: Site resume must be present
        run: |
          set -euo pipefail
          if [ ! -f portfolio/public/resume.pdf ]; then
            echo "::error file=portfolio/public/resume.pdf::missing; it is synced from resume/exports/Software_Engineer_General.pdf by sync-resume.yml"
            exit 1
          fi
      - name: Install
        run: npm ci
        working-directory: portfolio
      - name: Build
        run: npm run build
        working-directory: portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
