name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'resume/Main_Resume.pdf'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - name: Use Main_Resume as site resume
        run: cp resume/Main_Resume.pdf portfolio/public/resume.pdf
      - name: Install
        run: npm ci
        working-directory: portfolio
      - name: Build
        run: npm run build
        working-directory: portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
