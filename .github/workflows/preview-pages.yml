name: PR preview

# Per-PR preview builds, served from a separate repo because GitHub Pages
# hosts one site per repo:
#   https://vsreddyh.github.io/portfolio-previews/pr-<number>/
# Pushes via the PREVIEWS_DEPLOY_KEY deploy key (write access to
# vsreddyh/portfolio-previews only). That repo's root robots.txt disallows
# crawling, so previews stay out of search results.

on:
  pull_request:
    paths:
      - 'portfolio/**'
      - 'resume/Main_Resume.pdf'
      - '.github/workflows/preview-pages.yml'
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to preview (builds that PRs head commit)'
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One group, no cancellation: a close event must run after any in-flight
  # build, never concurrently (which could re-create a deleted preview) and
  # never cancelled (which would leak the preview folder).
  group: preview-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}

jobs:
  build-and-push:
    # Same-repo PRs only: forks get no secrets, so no preview.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate PR number
        run: |
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::PR_NUMBER is '${PR_NUMBER}' — expected a numeric PR number"
            exit 1
          fi
      - name: PR must exist (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" --json number,title --jq '"ok: #\(.number) \(.title)"'
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
          # Head, not the merge ref: refs/pull/<n>/merge doesn't exist when
          # the PR conflicts with its base, while head always does. For a
          # preview, the PR's own code is what we want anyway.
          ref: refs/pull/${{ github.event.inputs.pr }}/head

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - name: Use Main_Resume as site resume
        run: |
          set -euo pipefail
          if [ ! -f resume/Main_Resume.pdf ]; then
            echo "::error file=resume/Main_Resume.pdf::tracked PDF is missing; it is the file this site serves"
            exit 1
          fi
          mkdir -p portfolio/public
          cp resume/Main_Resume.pdf portfolio/public/resume.pdf
      - name: Install
        run: npm ci
        working-directory: portfolio
      - name: Build preview
        run: npm run build
        working-directory: portfolio
        env:
          SITE_BASE: /portfolio-previews/pr-${{ env.PR_NUMBER }}/

      - uses: actions/checkout@v5
        with:
          repository: vsreddyh/portfolio-previews
          path: previews
          # Full history: both jobs `pull --rebase` before pushing, which is
          # unreliable on the default shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Publish preview
        env:
          PREVIEWS_DEPLOY_KEY: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          : "${PR_NUMBER:?PR_NUMBER is empty}"
          # checkout's GIT_SSH_COMMAND override is temporary (fetch only), so
          # set up our own key for the push below.
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          # The secret store drops the trailing newline; OpenSSH rejects a
          # private key file without one, so always terminate it.
          printf '%s\n' "$PREVIEWS_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          export GIT_SSH_COMMAND="ssh -i $keyfile -o StrictHostKeyChecking=accept-new"
          dest="previews/pr-${PR_NUMBER}"
          mkdir -p "$dest"
          # --delete so removed pages don't linger in the preview.
          rsync -a --delete portfolio/dist/ "$dest/"
          # Astro emits _astro/; without this, Pages' Jekyll would ignore it.
          touch previews/.nojekyll
          # Checkout used HTTPS (no credentials); push over SSH with our key.
          cd previews
          git remote set-url origin "git@github.com:vsreddyh/portfolio-previews.git"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview unchanged; nothing to push."
          else
            git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit -m "preview pr-${PR_NUMBER} ${GITHUB_SHA::7}"
            # Rebase + retry: rapid syncs can race each other on main.
            pushed=""
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "push attempt $i failed; retrying"
              sleep 5
            done
            if [ -z "$pushed" ]; then
              echo "::error::push to portfolio-previews failed after 3 attempts"
              exit 1
            fi
          fi

      - name: Comment preview URL
        # Runs on workflow_dispatch too, so the manual run for a PR still
        # posts/updates the comment on that PR.
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- portfolio-preview -->';
            const url = `https://vsreddyh.github.io/portfolio-previews/pr-${process.env.PR_NUMBER}/`;
            const body = `${marker}\nPreview build: ${url}\nRebuilt on every push; removed when the PR closes.`;
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }

  cleanup:
    # Same guard as build-and-push: fork PRs never got a preview, and the
    # deploy key doesn't exist for them — fail closed instead of noisily.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: vsreddyh/portfolio-previews
          path: previews
          # Full history: both jobs `pull --rebase` before pushing, which is
          # unreliable on the default shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Remove preview
        env:
          PREVIEWS_DEPLOY_KEY: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          : "${PR_NUMBER:?PR_NUMBER is empty}"
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          # See publish step: the secret store drops the trailing newline.
          printf '%s\n' "$PREVIEWS_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          export GIT_SSH_COMMAND="ssh -i $keyfile -o StrictHostKeyChecking=accept-new"
          # Checkout used HTTPS (no credentials); push over SSH with our key.
          cd previews
          git remote set-url origin "git@github.com:vsreddyh/portfolio-previews.git"
          rm -rf "pr-${PR_NUMBER}"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
          else
            git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit -m "remove preview pr-${PR_NUMBER}"
            pushed=""
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "push attempt $i failed; retrying"
              sleep 5
            done
            if [ -z "$pushed" ]; then
              echo "::error::push to portfolio-previews failed after 3 attempts"
              exit 1
            fi
          fi
