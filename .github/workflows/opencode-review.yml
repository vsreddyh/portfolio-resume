name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure git identity for opencode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          variant: minimal
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues and potential bugs.
            - For `resume/*.tex` changes, enforce `resume/AGENTS.md`: no invented
              metrics or capabilities, bullets at most two lines, one page for
              derived resumes, never a single-bullet section.
            - For `portfolio/**` changes, check links, MDX frontmatter, and that
              `npm run build` expectations still hold.
            - Post findings as a PR review. Keep it short; do not approve.
