name: Flag case-study drift

# When the portfolio or the resume changes, the case studies are usually the
# thing that has gone stale: the site ships, and the prose about the projects
# quietly drifts from the code it describes. This workflow keeps exactly one
# rolling issue open for that review instead of relying on someone noticing.
#
# One issue, updated in place, never a new one per push — otherwise the
# tracker becomes noise and gets ignored, which is the failure mode this is
# meant to prevent.
#
# Deliberately scoped to THIS repo. Cross-repo "tell another repo I changed"
# plumbing needs a PAT with write access to that other repo, which is a much
# larger blast radius than the problem deserves.

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'resume/**'
      - '.github/workflows/case-study-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time: two pushes landing together must not race to update the
# same issue body.
concurrency:
  group: case-study-drift
  cancel-in-progress: false

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the change set is computed as "everything since the
          # last run of this workflow", which needs the parent commits.
          fetch-depth: 0

      - name: Work out what changed since the last run
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          # Last successful run of *this* workflow, excluding the one now
          # in flight. Falls back to the first commit on main when there is
          # no history yet, so the first run still reports something.
          PREV_SHA="$(gh api \
            "repos/$REPO/actions/workflows/${{ github.workflow }}/runs?status=success&per_page=2" \
            --jq '[.workflow_runs[] | select(.head_sha != "'"$HEAD_SHA"'")] | first | .head_sha // empty' \
            2>/dev/null || true)"

          if [ -z "$PREV_SHA" ]; then
            PREV_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            RANGE="single commit"
          else
            RANGE="$(git rev-parse --short "$PREV_SHA")..$(git rev-parse --short HEAD)"
          fi

          {
            echo "range=$RANGE"
            echo "prev=$PREV_SHA"
            echo "commits<<EOF"
            git log --no-merges --pretty='- %s (%h)' "$PREV_SHA..$HEAD_SHA" -- portfolio resume
            echo "EOF"
            echo "paths<<EOF"
            git diff --name-only "$PREV_SHA..$HEAD_SHA" -- portfolio resume
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$(git log --no-merges --pretty='%s' "$PREV_SHA..$HEAD_SHA" -- portfolio resume)" ]; then
            echo "no site or resume changes in $RANGE — nothing to flag"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ steps.changes.outputs.range }}
          COMMITS: ${{ steps.changes.outputs.commits }}
          PATHS: ${{ steps.changes.outputs.paths }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          MARKER="<!-- case-study-drift -->"
          PREAMBLE="<!-- Appended by .github/workflows/case-study-drift.yml. Do not close by hand;
               the next push that touches portfolio/ or resume/ adds another entry. -->"
          TITLE="Case studies may have drifted from the code ($RANGE)"

          # Reuse the open issue if there is one, so the tracker stays a
          # single rolling thread instead of a pile of near-duplicates.
          EXISTING="$(gh issue list --repo "$REPO" --state open \
            --search "case studies may have drifted in:title" \
            --json number --jq '.[0].number // empty')"

          BODY="$(mktemp)"
          {
            echo "$MARKER"
            echo "$PREAMBLE"
            echo
            echo "## $RANGE"
            echo
            echo "These paths changed, so the prose describing them may no longer be true:"
            echo
            echo '```'
            echo "$PATHS"
            echo '```'
            echo
            echo "Commits:"
            echo
            echo "$COMMITS"
            echo
            echo "**What to check:** every case study that describes a project touched here —"
            echo "does it still match the code? Names, numbers, feature lists and CLI verbs are"
            echo "the usual casualties. Delete this issue once the affected pages are verified."
          } > "$BODY"

          # An "entry" is everything from its "## <range>" heading down, and
          # that is what gets spliced forward. Keying off the heading rather
          # than the marker matters: the marker has to stay the FIRST line of
          # the body so the next run can find the issue body, so it can never
          # live inside the copied-forward history.
          entry_of() { sed -n '/^## /,$p' "$1"; }

          if [ -n "$EXISTING" ]; then
            PREV_BODY="$(gh issue view "$EXISTING" --repo "$REPO" --json body --jq .body)"
            printf '%s\n' "$PREV_BODY" > "${BODY}.prev"
            {
              echo "$MARKER"
              echo "$PREAMBLE"
              echo
              entry_of "$BODY"
              echo
              echo "---"
              echo
              entry_of "${BODY}.prev"
            } > "${BODY}.merged"
            gh issue edit "$EXISTING" --repo "$REPO" \
              --title "$TITLE" --body-file "${BODY}.merged" >/dev/null
            echo "updated issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$BODY" >/dev/null
            echo "created a new tracking issue"
          fi
